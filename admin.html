<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مؤسسة صخر المصري - لوحة التحكم الاحترافية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-900 text-white min-h-screen">
    
    <nav class="bg-gray-800 border-b border-gray-700 p-4 flex justify-between items-center">
        <h1 class="text-xl font-bold text-orange-500">لوحة التحكم ⚙️</h1>
        <a href="index.html" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded text-sm font-bold">عرض المتجر 🌐</a>
    </nav>

    <div id="login-section" class="max-w-md mx-auto mt-20 bg-gray-800 p-6 rounded-2xl border border-gray-700 shadow-xl">
        <h2 class="text-2xl font-bold mb-6 text-center text-orange-500">تسجيل دخول المشرف</h2>
        <form id="login-form" class="space-y-4">
            <div>
                <label class="block text-sm text-gray-400 mb-1">البريد الإلكتروني</label>
                <input type="email" id="email" required class="w-full p-3 bg-gray-900 border border-gray-700 rounded-xl text-white focus:outline-none focus:border-orange-500" placeholder="admin@example.com">
            </div>
            <div>
                <label class="block text-sm text-gray-400 mb-1">كلمة المرور</label>
                <input type="password" id="password" required class="w-full p-3 bg-gray-900 border border-gray-700 rounded-xl text-white focus:outline-none focus:border-orange-500" placeholder="••••••••">
            </div>
            <button type="submit" class="w-full bg-orange-600 hover:bg-orange-700 p-3 rounded-xl font-bold transition shadow">دخول للنظام</button>
        </form>
    </div>

    <div id="admin-section" class="container mx-auto p-4 hidden space-y-6 mt-6">
        
        <div class="bg-gray-800 p-6 rounded-2xl border border-gray-700">
            <h2 class="text-xl font-bold mb-4 text-orange-400">🎨 إعدادات المتجر العامة</h2>
            <form id="settings-form" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm text-gray-400 mb-1">اسم المتجر</label>
                    <input type="text" id="store-name-input" class="w-full p-2 bg-gray-900 border border-gray-700 rounded-xl text-white" value="مؤسسة صخر المصري">
                </div>
                <div>
                    <label class="block text-sm text-gray-400 mb-1">رابط الشعار (Logo URL)</label>
                    <input type="text" id="store-logo-input" class="w-full p-2 bg-gray-900 border border-gray-700 rounded-xl text-white" placeholder="https://example.com/logo.png">
                </div>
                <div class="md:col-span-2">
                    <button type="submit" class="bg-blue-600 hover:bg-blue-700 px-6 py-2.5 rounded-xl font-bold shadow">حفظ الإعدادات</button>
                </div>
            </form>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-gray-800 p-6 rounded-2xl border border-gray-700">
                <h2 class="text-xl font-bold mb-4 text-orange-400">📦 إضافة منتج جديد</h2>
                <form id="product-form" class="space-y-3">
                    <input type="text" id="p-name" placeholder="اسم المنتج (مثال: شاشة آيفون)" required class="w-full p-2.5 bg-gray-900 border border-gray-700 rounded-xl text-white">
                    <select id="p-cat" class="w-full p-2.5 bg-gray-900 border border-gray-700 rounded-xl text-white">
                        <option value="شاشات">شاشات</option>
                        <option value="بطاريات">بطاريات</option>
                        <option value="أدوات صيانة">أدوات صيانة</option>
                        <option value="كيبلات وإكسسوارات">كيبلات وإكسسوارات</option>
                    </select>
                    <textarea id="p-desc" placeholder="وصف المنتج أو حالة القطعة (موفر / أصلية)" class="w-full p-2.5 bg-gray-900 border border-gray-700 rounded-xl text-white"></textarea>
                    <div class="grid grid-cols-2 gap-2">
                        <input type="number" id="p-price" placeholder="السعر (د.أ)" required class="w-full p-2.5 bg-gray-900 border border-gray-700 rounded-xl text-white">
                        <input type="number" id="p-discount" placeholder="نسبة الخصم % (اختياري)" class="w-full p-2.5 bg-gray-900 border border-gray-700 rounded-xl text-white">
                    </div>
                    <button type="submit" class="w-full bg-green-600 hover:bg-green-700 p-3 rounded-xl font-bold shadow">إضافة للمتجر</button>
                </form>
            </div>

            <div class="bg-gray-800 p-6 rounded-2xl border border-gray-700">
                <h2 class="text-xl font-bold mb-4 text-orange-400">🗑️ قائمة المنتجات (للحذف والتعديل)</h2>
                <div id="admin-products-list" class="space-y-2 max-h-72 overflow-y-auto pr-2">
                    <p class="text-gray-400 text-sm">جاري التحميل...</p>
                </div>
            </div>
        </div>

        <div class="text-center pt-2">
            <button id="logout-btn" class="bg-red-600 hover:bg-red-700 px-8 py-2.5 rounded-xl font-bold shadow">تسجيل الخروج</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCb09c67UUqwwLr-vULeTkHqQR2li7AASI",
            authDomain: "ska-storu.firebaseapp.com",
            projectId: "ska-storu",
            storageBucket: "ska-storu.firebasestorage.app",
            messagingSenderId: "574053376429",
            appId: "1:574053376429:web:b3d01c62c625b10a368124"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const loginSection = document.getElementById('login-section');
        const adminSection = document.getElementById('admin-section');
        const loginForm = document.getElementById('login-form');
        const productForm = document.getElementById('product-form');
        const settingsForm = document.getElementById('settings-form');
        const logoutBtn = document.getElementById('logout-btn');
        const adminProductsList = document.getElementById('admin-products-list');

        onAuthStateChanged(auth, (user) => {
            if (user) {
                loginSection.classList.add('hidden');
                adminSection.classList.remove('hidden');
                loadAdminProducts();
                loadSettings();
            } else {
                loginSection.classList.remove('hidden');
                adminSection.classList.add('hidden');
            }
        });

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            try {
                await signInWithEmailAndPassword(auth, email, password);
                alert('تم تسجيل الدخول بنجاح!');
            } catch (error) {
                alert('خطأ في البريد أو كلمة المرور: ' + error.message);
            }
        });

        productForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('p-name').value;
            const cat = document.getElementById('p-cat').value;
            const description = document.getElementById('p-desc').value;
            const price = Number(document.getElementById('p-price').value);
            const discount = Number(document.getElementById('p-discount').value) || 0;

            try {
                await addDoc(collection(db, "products"), {
                    name,
                    cat,
                    description,
                    price,
                    discount,
                    finalPrice: discount > 0 ? price - (price * discount / 100) : price,
                    createdAt: new Date()
                });
                alert('تمت إضافة المنتج بنجاح!');
                productForm.reset();
                loadAdminProducts();
            } catch (error) {
                alert('خطأ في الإضافة: ' + error.message);
            }
        });

        window.deleteProduct = async function(id) {
            if (confirm('هل أنت متأكد من حذف هذا المنتج؟')) {
                try {
                    await deleteDoc(doc(db, "products", id));
                    alert('تم الحذف بنجاح');
                    loadAdminProducts();
                } catch (err) {
                    alert('خطأ أثناء الحذف');
                }
            }
        };

        async function loadAdminProducts() {
            adminProductsList.innerHTML = '';
            const querySnapshot = await getDocs(collection(db, "products"));
            if (querySnapshot.empty) {
                adminProductsList.innerHTML = '<p class="text-gray-400 text-sm">لا توجد منتجات حالياً.</p>';
                return;
            }
            querySnapshot.forEach((document) => {
                const p = document.data();
                adminProductsList.innerHTML += `
                    <div class="bg-gray-900 p-3 rounded-xl flex justify-between items-center border border-gray-700">
                        <div>
                            <h4 class="font-bold text-orange-400 text-sm">${p.name}</h4>
                            <span class="text-xs text-green-400">${p.finalPrice || p.price} د.أ (${p.cat})</span>
                        </div>
                        <button onclick="deleteProduct('${document.id}')" class="bg-red-600 hover:bg-red-700 px-3 py-1 rounded-lg text-xs font-bold">حذف</button>
                    </div>
                `;
            });
        }

        settingsForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const storeName = document.getElementById('store-name-input').value;
            const storeLogo = document.getElementById('store-logo-input').value;

            try {
                await setDoc(doc(db, "settings", "general"), { storeName, storeLogo });
                alert('تم حفظ الإعدادات بنجاح!');
            } catch (err) {
                alert('خطأ في الحفظ');
            }
        });

        async function loadSettings() {
            try {
                const sDoc = await getDoc(doc(db, "settings", "general"));
                if (sDoc.exists()) {
                    const data = sDoc.data();
                    if(data.storeName) document.getElementById('store-name-input').value = data.storeName;
                    if(data.storeLogo) document.getElementById('store-logo-input').value = data.storeLogo;
                }
            } catch(e) {}
        }

        logoutBtn.addEventListener('click', () => {
            signOut(auth);
        });
    </script>
</body>
</html>
