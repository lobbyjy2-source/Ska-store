<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم | مؤسسة صخر المصري</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #0A0A0A;
            --panel: #141414;
            --panel-2: #1F1F1F;
            --line: #2A2A2A;
            --text: #F9FAFB;
            --muted: #9CA3AF;
            --primary: #EF4444;
        }
        body { background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-4xl mx-auto">
        <!-- رأس لوحة التحكم -->
        <div class="flex justify-between items-center mb-8 border-b border-[var(--line)] pb-4">
            <div>
                <h1 class="text-xl md:text-2xl font-black text-[var(--primary)] flex items-center">
                    <i class="fa-solid fa-lock-open ml-2"></i> لوحة تحكم مؤسسة صخر المصري
                </h1>
                <p class="text-xs text-[var(--muted)] mt-1">إدارة المنتجات، تخصيص الهوية والألوان، وأوقات العمل</p>
            </div>
            <a href="index.html" class="bg-[var(--panel-2)] border border-[var(--line)] px-4 py-2 rounded-xl text-xs font-bold hover:bg-[var(--line)] transition flex items-center space-x-1.5 space-x-reverse">
                <i class="fa-solid fa-store text-xs"></i>
                <span>عرض المتجر</span>
            </a>
        </div>

        <!-- تبويبات لوحة التحكم -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
            
            <!-- قسم تخصيص ألوان المتجر وأوقات العمل (الجديد) -->
            <div class="bg-[var(--panel)] border border-[var(--line)] rounded-2xl p-5 shadow-xl">
                <h2 class="font-black text-sm mb-4 text-[var(--primary)] flex items-center">
                    <i class="fa-solid fa-palette ml-2"></i> إعدادات الهوية وأوقات العمل
                </h2>
                
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold mb-1.5">اللون الرئيسي للموقع (Theme Color):</label>
                        <div class="flex items-center space-x-3 space-x-reverse">
                            <input type="color" id="shop-primary-color" value="#DC2626" class="w-12 h-10 bg-transparent rounded-xl cursor-pointer border border-[var(--line)]">
                            <span class="text-xs text-[var(--muted)]">اختر اللون البارز للأزرار والعناصر (مثال: أحمر، أزرق، أخضر)</span>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold mb-1.5">أوقات العمل الرسمية:</label>
                        <input type="text" id="shop-working-hours" placeholder="السبت - الخميس: 10 صباحاً - 10 مساءً" class="w-full p-2.5 bg-[var(--panel-2)] border border-[var(--line)] rounded-xl text-xs text-[var(--text)] focus:border-red-500 outline-none">
                    </div>

                    <button onclick="saveStoreSettings()" class="w-full bg-[var(--primary)] text-white py-2.5 rounded-xl font-bold text-xs shadow hover:opacity-95 transition">
                        حفظ إعدادات المتجر
                    </button>
                </div>
            </div>

            <!-- قسم إضافة منتج جديد -->
            <div class="bg-[var(--panel)] border border-[var(--line)] rounded-2xl p-5 shadow-xl">
                <h2 class="font-black text-sm mb-4 text-[var(--primary)] flex items-center">
                    <i class="fa-solid fa-plus-circle ml-2"></i> إضافة منتج جديد
                </h2>
                
                <form id="product-form" class="space-y-3">
                    <input type="text" id="p-name" placeholder="اسم المنتج (مثال: شاشة آيفون)" required class="w-full p-2.5 bg-[var(--panel-2)] border border-[var(--line)] rounded-xl text-xs text-[var(--text)] focus:border-red-500 outline-none">
                    
                    <select id="p-cat" class="w-full p-2.5 bg-[var(--panel-2)] border border-[var(--line)] rounded-xl text-xs text-[var(--text)] focus:border-red-500 outline-none">
                        <option value="شاشات">شاشات</option>
                        <option value="بطاريات">بطاريات</option>
                        <option value="أدوات صيانة">أدوات صيانة</option>
                        <option value="كيبلات وإكسسوارات">كيبلات وإكسسوارات</option>
                    </select>

                    <div class="grid grid-cols-2 gap-2">
                        <input type="number" id="p-price" placeholder="السعر الأساسي (د.أ)" required class="p-2.5 bg-[var(--panel-2)] border border-[var(--line)] rounded-xl text-xs text-[var(--text)] focus:border-red-500 outline-none">
                        <input type="number" id="p-discount" placeholder="نسبة الخصم % (اختياري)" class="p-2.5 bg-[var(--panel-2)] border border-[var(--line)] rounded-xl text-xs text-[var(--text)] focus:border-red-500 outline-none">
                    </div>

                    <select id="p-status" class="w-full p-2.5 bg-[var(--panel-2)] border border-[var(--line)] rounded-xl text-xs text-[var(--text)] focus:border-red-500 outline-none">
                        <option value="متوفر">متوفر</option>
                        <option value="متوفر بكميات محدودة">متوفر بكميات محدودة</option>
                        <option value="منتهي">منتهي</option>
                    </select>

                    <input type="text" id="p-image" placeholder="رابط صورة المنتج (URL)" class="w-full p-2.5 bg-[var(--panel-2)] border border-[var(--line)] rounded-xl text-xs text-[var(--text)] focus:border-red-500 outline-none">

                    <button type="submit" id="submit-btn" class="w-full bg-[var(--primary)] text-white py-2.5 rounded-xl font-bold text-xs shadow hover:opacity-95 transition">
                        إضافة المنتج للمتجر
                    </button>
                </form>
            </div>

        </div>

        <!-- جدول المنتجات الحالية -->
        <div class="bg-[var(--panel)] border border-[var(--line)] rounded-2xl p-5 shadow-xl">
            <h2 class="font-black text-sm mb-4 text-[var(--text)] flex items-center">
                <i class="fa-solid fa-boxes-stacked ml-2 text-[var(--primary)]"></i> المنتجات المسجلة حالياً
            </h2>
            <div class="overflow-x-auto">
                <table class="w-full text-right text-xs">
                    <thead>
                        <tr class="border-b border-[var(--line)] text-[var(--muted)]">
                            <th class="pb-3">المنتج</th>
                            <th class="pb-3">القسم</th>
                            <th class="pb-3">السعر</th>
                            <th class="pb-3">الحالة</th>
                            <th class="pb-3 text-center">إجراءات</th>
                        </tr>
                    </thead>
                    <tbody id="admin-products-list">
                        <tr><td colspan="5" class="text-center py-4 text-[var(--muted)]">جاري تحميل المنتجات...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc, deleteDoc, doc, updateDoc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCb09c67UUqwwLr-vULeTkHqQR2li7AASI",
            authDomain: "ska-storu.firebaseapp.com",
            projectId: "ska-storu",
            storageBucket: "ska-storu.firebasestorage.app",
            messagingSenderId: "574053376429",
            appId: "1:574053376429:web:b3d01c62c625b10a368124"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // تحميل الإعدادات المحفوظة مسبقاً في اللوحة
        async function loadAdminSettings() {
            try {
                const docRef = doc(db, "settings", "store_config");
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    if(data.primaryColor) document.getElementById('shop-primary-color').value = data.primaryColor;
                    if(data.workingHours) document.getElementById('shop-working-hours').value = data.workingHours;
                }
            } catch(e) { console.log(e); }
        }

        window.saveStoreSettings = async function() {
            const primaryColor = document.getElementById('shop-primary-color').value;
            const workingHours = document.getElementById('shop-working-hours').value;

            try {
                await setDoc(doc(db, "settings", "store_config"), {
                    primaryColor: primaryColor,
                    workingHours: workingHours
                }, { merge: true });
                alert("✨ تم حفظ إعدادات وتصاميم المتجر بنجاح وتطبيقها على الفور!");
            } catch(e) {
                alert("خطأ أثناء الحفظ: " + e.message);
            }
        }

        async function fetchAdminProducts() {
            const tbody = document.getElementById('admin-products-list');
            tbody.innerHTML = '';
            try {
                const querySnapshot = await getDocs(collection(db, "products"));
                if (querySnapshot.empty) {
                    tbody.innerHTML = `<tr><td colspan="5" class="text-center py-4 text-[var(--muted)]">لا توجد منتجات حالياً.</td></tr>`;
                    return;
                }
                querySnapshot.forEach((document) => {
                    const p = document.data();
                    const id = document.id;
                    tbody.innerHTML += `
                        <tr class="border-b border-[var(--line)] hover:bg-[var(--panel-2)] transition">
                            <td class="py-3 font-bold">${p.name}</td>
                            <td class="py-3 text-[var(--muted)]">${p.cat}</td>
                            <td class="py-3 text-[var(--primary)] font-black">${p.finalPrice || p.price} د.أ</td>
                            <td class="py-3">${p.status}</td>
                            <td class="py-3 text-center">
                                <button onclick="deleteProduct('${id}')" class="bg-red-500/10 text-red-500 px-3 py-1 rounded-lg font-bold hover:bg-red-500 hover:text-white transition">حذف</button>
                            </td>
                        </tr>
                    `;
                });
            } catch(e) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center py-4 text-red-500">خطأ في جلب المنتجات</td></tr>`;
            }
        }

        document.getElementById('product-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('p-name').value;
            const cat = document.getElementById('p-cat').value;
            const price = parseFloat(document.getElementById('p-price').value);
            const discount = parseFloat(document.getElementById('p-discount').value) || 0;
            const status = document.getElementById('p-status').value;
            const image = document.getElementById('p-image').value;

            const finalPrice = discount > 0 ? price - (price * (discount / 100)) : price;

            try {
                await addDoc(collection(db, "products"), {
                    name, cat, price, discount, finalPrice, status, image, createdAt: new Date()
                });
                alert("تمت إضافة المنتج بنجاح!");
                document.getElementById('product-form').reset();
                fetchAdminProducts();
            } catch(err) {
                alert("حدث خطأ أثناء الإضافة");
            }
        });

        window.deleteProduct = async function(id) {
            if(confirm("هل أنت متأكد من حذف هذا المنتج؟")) {
                try {
                    await deleteDoc(doc(db, "products", id));
                    fetchAdminProducts();
                } catch(e) {
                    alert("خطأ أثناء الحذف");
                }
            }
        }

        loadAdminSettings();
        fetchAdminProducts();
    </script>
</body>
</html>
