<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مؤسسة صخر المصري | لوحة التحكم الإدارية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #0A0A0A; color: #F9FAFB; font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="min-h-screen">
    
    <nav class="bg-[#141414] border-b border-[#2A2A2A] p-4 flex justify-between items-center shadow-md">
        <div class="flex items-center space-x-3 space-x-reverse">
            <div class="w-9 h-9 bg-black border border-red-500 rounded-xl flex items-center justify-center">
                <span class="text-white font-black text-xs">SKA</span>
            </div>
            <h1 class="text-base font-bold text-red-500">لوحة التحكم - مؤسسة صخر المصري ⚙️</h1>
        </div>
        <a href="index.html" class="bg-[#1F1F1F] hover:bg-[#2A2A2A] border border-[#2A2A2A] px-4 py-2 rounded-xl text-xs font-bold transition">عرض المتجر الرئيسي 🌐</a>
    </nav>

    <div id="login-section" class="max-w-md mx-auto mt-24 bg-[#141414] p-8 rounded-2xl border border-[#2A2A2A] shadow-2xl">
        <div class="text-center mb-6">
            <div class="w-12 h-12 bg-black border border-red-500 rounded-2xl mx-auto flex items-center justify-center mb-3">
                <i class="fa-solid fa-lock text-red-500 text-lg"></i>
            </div>
            <h2 class="text-xl font-black text-white">تسجيل دخول المشرف</h2>
            <p class="text-xs text-gray-400 mt-1">منطقة مقيدة - خاصة بإدارة مؤسسة صخر المصري</p>
        </div>
        
        <form id="login-form" class="space-y-4">
            <div>
                <label class="block text-xs text-gray-400 mb-1 font-bold">البريد الإلكتروني للإدارة</label>
                <input type="email" id="email" required class="w-full p-3 bg-[#0A0A0A] border border-[#2A2A2A] rounded-xl text-sm text-white focus:outline-none focus:border-red-500 transition" placeholder="admin@ska.com">
            </div>
            <div>
                <label class="block text-xs text-gray-400 mb-1 font-bold">كلمة المرور</label>
                <input type="password" id="password" required class="w-full p-3 bg-[#0A0A0A] border border-[#2A2A2A] rounded-xl text-sm text-white focus:outline-none focus:border-red-500 transition" placeholder="••••••••">
            </div>
            <button type="submit" class="w-full bg-red-600 hover:bg-red-700 p-3 rounded-xl font-bold text-sm transition shadow-lg text-white">دخول للنظام الإداري</button>
        </form>
    </div>

    <div id="admin-section" class="container mx-auto p-4 md:p-8 hidden space-y-8 mt-4">
        
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            
            <div class="bg-[#141414] p-6 rounded-2xl border border-[#2A2A2A] shadow-xl">
                <h2 class="text-lg font-black mb-4 text-red-500 flex items-center">
                    <i class="fa-solid fa-box-archive ml-2"></i> إضافة منتج أو عرض جديد
                </h2>
                
                <form id="product-form" class="space-y-4">
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">اسم المنتج</label>
                        <input type="text" id="p-name" placeholder="مثال: شاشة آيفون 13 أصلية" required class="w-full p-3 bg-[#0A0A0A] border border-[#2A2A2A] rounded-xl text-sm text-white focus:border-red-500">
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs text-gray-400 mb-1">القسم</label>
                            <select id="p-cat" class="w-full p-3 bg-[#0A0A0A] border border-[#2A2A2A] rounded-xl text-sm text-white">
                                <option value="شاشات">شاشات</option>
                                <option value="بطاريات">بطاريات</option>
                                <option value="أدوات صيانة">أدوات صيانة</option>
                                <option value="كيبلات وإكسسوارات">كيبلات وإكسسوارات</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs text-gray-400 mb-1">حالة الكمية</label>
                            <select id="p-status" class="w-full p-3 bg-[#0A0A0A] border border-[#2A2A2A] rounded-xl text-sm text-white">
                                <option value="متوفر">متوفر</option>
                                <option value="متوفر بكميات محدودة">متوفر بكميات محدودة</option>
                                <option value="منتهي">منتهي</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs text-gray-400 mb-1">رابط صورة المنتج (Image URL - اختياري)</label>
                        <input type="text" id="p-image" placeholder="https://example.com/image.jpg" class="w-full p-3 bg-[#0A0A0A] border border-[#2A2A2A] rounded-xl text-sm text-white">
                    </div>

                    <div>
                        <label class="block text-xs text-gray-400 mb-1">وصف المنتج أو تفاصيله</label>
                        <textarea id="p-desc" placeholder="اكتب وصفاً مختصراً للقطعة أو جودتها..." class="w-full p-3 bg-[#0A0A0A] border border-[#2A2A2A] rounded-xl text-sm text-white h-20"></textarea>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs text-gray-400 mb-1">السعر الأساسي (د.أ)</label>
                            <input type="number" id="p-price" placeholder="50" required class="w-full p-3 bg-[#0A0A0A] border border-[#2A2A2A] rounded-xl text-sm text-white">
                        </div>
                        <div>
                            <label class="block text-xs text-gray-400 mb-1">نسبة الخصم العرض % (اختياري)</label>
                            <input type="number" id="p-discount" placeholder="مثال: 15" class="w-full p-3 bg-[#0A0A0A] border border-[#2A2A2A] rounded-xl text-sm text-white">
                        </div>
                    </div>

                    <button type="submit" class="w-full bg-green-600 hover:bg-green-700 p-3 rounded-xl font-bold text-sm shadow transition text-white">حفظ وإضافة المنتج للمتجر</button>
                </form>
            </div>

            <div class="bg-[#141414] p-6 rounded-2xl border border-[#2A2A2A] shadow-xl flex flex-col justify-between">
                <div>
                    <h2 class="text-lg font-black mb-4 text-red-500 flex items-center">
                        <i class="fa-solid fa-list-check ml-2"></i> المنتجات الحالية في النظام (للحذف)
                    </h2>
                    <div id="admin-products-list" class="space-y-3 max-h-[450px] overflow-y-auto pr-1">
                        <p class="text-gray-500 text-sm text-center py-10">جاري تحميل المنتجات...</p>
                    </div>
                </div>

                <div class="pt-6 border-t border-[#2A2A2A] mt-6 text-center">
                    <button id="logout-btn" class="bg-red-600 hover:bg-red-700 px-6 py-2.5 rounded-xl font-bold text-xs transition text-white">تسجيل الخروج الآمن</button>
                </div>
            </div>

        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCb09c67UUqwwLr-vULeTkHqQR2li7AASI",
            authDomain: "ska-storu.firebaseapp.com",
            projectId: "ska-storu",
            storageBucket: "ska-storu.firebasestorage.app",
            messagingSenderId: "574053376429",
            appId: "1:574053376429:web:b3d01c62c625b10a368124"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const loginSection = document.getElementById('login-section');
        const adminSection = document.getElementById('admin-section');
        const loginForm = document.getElementById('login-form');
        const productForm = document.getElementById('product-form');
        const logoutBtn = document.getElementById('logout-btn');
        const adminProductsList = document.getElementById('admin-products-list');

        onAuthStateChanged(auth, (user) => {
            if (user) {
                loginSection.classList.add('hidden');
                adminSection.classList.remove('hidden');
                loadAdminProducts();
            } else {
                loginSection.classList.remove('hidden');
                adminSection.classList.add('hidden');
            }
        });

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            try {
                await signInWithEmailAndPassword(auth, email, password);
                alert('تم تسجيل الدخول بنجاح يا باشا!');
            } catch (error) {
                alert('خطأ في بيانات الدخول: ' + error.message);
            }
        });

        productForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('p-name').value;
            const cat = document.getElementById('p-cat').value;
            const status = document.getElementById('p-status').value;
            const image = document.getElementById('p-image').value;
            const description = document.getElementById('p-desc').value;
            const price = Number(document.getElementById('p-price').value);
            const discount = Number(document.getElementById('p-discount').value) || 0;

            const finalPrice = discount > 0 ? price - (price * discount / 100) : price;

            try {
                await addDoc(collection(db, "products"), {
                    name,
                    cat,
                    status,
                    image,
                    description,
                    price,
                    discount,
                    finalPrice,
                    createdAt: new Date()
                });
                alert('تمت إضافة المنتج بنجاح إلى مؤسسة صخر المصري!');
                productForm.reset();
                loadAdminProducts();
            } catch (error) {
                alert('خطأ أثناء إضافة المنتج: ' + error.message);
            }
        });

        window.deleteProduct = async function(id) {
            if (confirm('هل أنت متأكد من حذف هذا المنتج نهائياً؟')) {
                try {
                    await deleteDoc(doc(db, "products", id));
                    alert('تم الحذف بنجاح');
                    loadAdminProducts();
                } catch (err) {
                    alert('خطأ أثناء عملية الحذف');
                }
            }
        };

        async function loadAdminProducts() {
            adminProductsList.innerHTML = '';
            try {
                const querySnapshot = await getDocs(collection(db, "products"));
                if (querySnapshot.empty) {
                    adminProductsList.innerHTML = '<p class="text-gray-500 text-sm text-center py-6">لا توجد منتجات مضافة حالياً.</p>';
                    return;
                }
                querySnapshot.forEach((document) => {
                    const p = document.data();
                    adminProductsList.innerHTML += `
                        <div class="bg-[#0A0A0A] p-3 rounded-xl flex justify-between items-center border border-[#2A2A2A]">
                            <div class="flex items-center space-x-3 space-x-reverse">
                                <div class="w-10 h-10 bg-gray-800 rounded-lg overflow-hidden flex items-center justify-center">
                                    ${p.image ? `<img src="${p.image}" class="w-full h-full object-cover">` : `<i class="fa-solid fa-microchip text-xs text-gray-400"></i>`}
                                </div>
                                <div>
                                    <h4 class="font-bold text-xs text-white line-clamp-1">${p.name}</h4>
                                    <span class="text-[10px] text-red-500 font-bold">${p.finalPrice} د.أ (${p.cat}) - <span class="text-gray-400">${p.status}</span></span>
                                </div>
                            </div>
                            <button onclick="deleteProduct('${document.id}')" class="bg-red-600 hover:bg-red-700 px-3 py-1.5 rounded-lg text-xs font-bold transition text-white">حذف</button>
                        </div>
                    `;
                });
            } catch(e) {
                adminProductsList.innerHTML = '<p class="text-red-500 text-sm text-center">خطأ في جلب المنتجات</p>';
            }
        }

        logoutBtn.addEventListener('click', () => {
            signOut(auth);
        });
    </script>
</body>
</html>
