<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مؤسسة صخر المصري | لوحة التحكم الذهبية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #0A0A0A; color: #F9FAFB; font-family: system-ui, -apple-system, sans-serif; }
        .gold-text { color: #D4AF37; }
        .gold-border { border-color: #D4AF37; }
        .gold-bg { background-color: #D4AF37; color: #000; }
        .gold-bg:hover { background-color: #C5A028; }
        .admin-ornament-box {
            border: 2px solid #D4AF37;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.12);
            background-image: radial-gradient(circle at top right, rgba(212, 175, 55, 0.04), transparent 50%);
        }
    </style>
</head>
<body class="min-h-screen">
    
    <nav class="bg-[#141414] border-b gold-border p-4 flex justify-between items-center shadow-md">
        <div class="flex items-center space-x-3 space-x-reverse">
            <div class="w-9 h-9 bg-black border gold-border rounded-xl flex items-center justify-center">
                <span class="gold-text font-black text-xs">SKA</span>
            </div>
            <h1 class="text-base font-bold gold-text">لوحة تحكم المشرف - مؤسسة صخر المصري ⚙️</h1>
        </div>
        <a href="index.html" class="bg-[#1F1F1F] hover:bg-[#2A2A2A] border gold-border px-4 py-2 rounded-xl text-xs font-bold transition gold-text">عرض المتجر 🌐</a>
    </nav>

    <div id="login-section" class="max-w-md mx-auto mt-24 bg-[#141414] p-8 rounded-2xl admin-ornament-box">
        <div class="text-center mb-6">
            <div class="w-12 h-12 bg-black border gold-border rounded-2xl mx-auto flex items-center justify-center mb-3">
                <i class="fa-solid fa-lock gold-text text-lg"></i>
            </div>
            <h2 class="text-xl font-black text-white">تسجيل دخول المشرف</h2>
        </div>
        
        <form id="login-form" class="space-y-4">
            <div>
                <label class="block text-xs text-gray-400 mb-1 font-bold">البريد الإلكتروني للإدارة</label>
                <input type="email" id="email" required class="w-full p-3 bg-[#0A0A0A] border border-[#2A2A2A] rounded-xl text-sm text-white focus:outline-none focus:border-[#D4AF37] transition" placeholder="admin@ska.com">
            </div>
            <div>
                <label class="block text-xs text-gray-400 mb-1 font-bold">كلمة المرور</label>
                <input type="password" id="password" required class="w-full p-3 bg-[#0A0A0A] border border-[#2A2A2A] rounded-xl text-sm text-white focus:outline-none focus:border-[#D4AF37] transition" placeholder="••••••••">
            </div>
            <button type="submit" class="w-full gold-bg p-3 rounded-xl font-bold text-sm transition shadow-lg">دخول للنظام</button>
        </form>
    </div>

    <div id="admin-section" class="container mx-auto p-4 md:p-8 hidden space-y-8 mt-4">
        
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            
            <div class="bg-[#141414] p-6 rounded-2xl admin-ornament-box">
                <h2 class="text-lg font-black mb-4 gold-text flex items-center">
                    <i class="fa-solid fa-box-archive ml-2"></i> إضافة منتج جديد
                </h2>
                
                <form id="product-form" class="space-y-4">
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">اسم المنتج</label>
                        <input type="text" id="p-name" placeholder="مثال: شاشة آيفون أصلية" required class="w-full p-3 bg-[#0A0A0A] border border-[#2A2A2A] rounded-xl text-sm text-white focus:border-[#D4AF37]">
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs text-gray-400 mb-1">القسم</label>
                            <select id="p-cat" class="w-full p-3 bg-[#0A0A0A] border border-[#2A2A2A] rounded-xl text-sm text-white">
                                <option value="شاشات">شاشات</option>
                                <option value="بطاريات">بطاريات</option>
                                <option value="أدوات صيانة">أدوات صيانة</option>
                                <option value="كيبلات وإكسسوارات">كيبلات وإكسسوارات</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs text-gray-400 mb-1">حالة الكمية</label>
                            <select id="p-status" class="w-full p-3 bg-[#0A0A0A] border border-[#2A2A2A] rounded-xl text-sm text-white">
                                <option value="متوفر">متوفر</option>
                                <option value="متوفر بكميات محدودة">متوفر بكميات محدودة</option>
                                <option value="منتهي">منتهي</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs text-gray-400 mb-1">اختر صورة المنتج من ملفات الجهاز</label>
                        <input type="file" id="p-image-file" accept="image/*" class="w-full p-2.5 bg-[#0A0A0A] border border-[#2A2A2A] rounded-xl text-xs text-gray-300 file:bg-[#2A2A2A] file:text-white file:border-0 file:rounded-lg file:px-3 file:py-1">
                    </div>

                    <div>
                        <label class="block text-xs text-gray-400 mb-1">وصف المنتج</label>
                        <textarea id="p-desc" placeholder="وصف القطعة..." class="w-full p-3 bg-[#0A0A0A] border border-[#2A2A2A] rounded-xl text-sm text-white h-20"></textarea>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs text-gray-400 mb-1">السعر (د.أ)</label>
                            <input type="number" id="p-price" placeholder="50" required class="w-full p-3 bg-[#0A0A0A] border border-[#2A2A2A] rounded-xl text-sm text-white">
                        </div>
                        <div>
                            <label class="block text-xs text-gray-400 mb-1">نسبة الخصم % (اختياري)</label>
                            <input type="number" id="p-discount" placeholder="10" class="w-full p-3 bg-[#0A0A0A] border border-[#2A2A2A] rounded-xl text-sm text-white">
                        </div>
                    </div>

                    <button type="submit" class="w-full gold-bg p-3 rounded-xl font-bold text-sm shadow transition">حفظ وإضافة للمتجر</button>
                </form>
            </div>

            <div class="bg-[#141414] p-6 rounded-2xl admin-ornament-box flex flex-col justify-between">
                <div>
                    <h2 class="text-lg font-black mb-4 gold-text flex items-center">
                        <i class="fa-solid fa-list-check ml-2"></i> قائمة المنتجات الحالية
                    </h2>
                    <div id="admin-products-list" class="space-y-3 max-h-[450px] overflow-y-auto pr-1">
                        <p class="text-gray-500 text-sm text-center py-10">جاري التحميل...</p>
                    </div>
                </div>

                <div class="pt-6 border-t border-[#2A2A2A] mt-6 text-center">
                    <button id="logout-btn" class="bg-red-600 hover:bg-red-700 px-6 py-2.5 rounded-xl font-bold text-xs transition text-white">تسجيل الخروج</button>
                </div>
            </div>

        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCb09c67UUqwwLr-vULeTkHqQR2li7AASI",
            authDomain: "ska-storu.firebaseapp.com",
            projectId: "ska-storu",
            storageBucket: "ska-storu.firebasestorage.app",
            messagingSenderId: "574053376429",
            appId: "1:574053376429:web:b3d01c62c625b10a368124"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const loginSection = document.getElementById('login-section');
        const adminSection = document.getElementById('admin-section');
        const loginForm = document.getElementById('login-form');
        const productForm = document.getElementById('product-form');
        const logoutBtn = document.getElementById('logout-btn');
        const adminProductsList = document.getElementById('admin-products-list');

        onAuthStateChanged(auth, (user) => {
            if (user) {
                loginSection.classList.add('hidden');
                adminSection.classList.remove('hidden');
                loadAdminProducts();
            } else {
                loginSection.classList.remove('hidden');
                adminSection.classList.add('hidden');
            }
        });

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            try {
                await signInWithEmailAndPassword(auth, email, password);
            } catch (error) {}
        });

        productForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('p-name').value;
            const cat = document.getElementById('p-cat').value;
            const status = document.getElementById('p-status').value;
            const description = document.getElementById('p-desc').value;
            const price = Number(document.getElementById('p-price').value);
            const discount = Number(document.getElementById('p-discount').value) || 0;
            const finalPrice = discount > 0 ? price - (price * discount / 100) : price;

            const imageFile = document.getElementById('p-image-file').files[0];

            if (imageFile) {
                const reader = new FileReader();
                reader.onload = async function(uploadEvent) {
                    const base64Image = uploadEvent.target.result;
                    await saveProductToDb(name, cat, status, description, price, discount, finalPrice, base64Image);
                };
                reader.readAsDataURL(imageFile);
            } else {
                await saveProductToDb(name, cat, status, description, price, discount, finalPrice, '');
            }
        });

        async function saveProductToDb(name, cat, status, description, price, discount, finalPrice, image) {
            try {
                await addDoc(collection(db, "products"), {
                    name, cat, status, description, price, discount, finalPrice, image, createdAt: new Date()
                });
                productForm.reset();
                loadAdminProducts();
            } catch (error) {}
        }

        window.deleteProduct = async function(id) {
            try {
                await deleteDoc(doc(db, "products", id));
                loadAdminProducts();
            } catch (err) {}
        };

        async function loadAdminProducts() {
            adminProductsList.innerHTML = '';
            try {
                const querySnapshot = await getDocs(collection(db, "products"));
                if (querySnapshot.empty) {
                    adminProductsList.innerHTML = '<p class="text-gray-500 text-sm text-center py-6">لا توجد منتجات حالياً.</p>';
                    return;
                }
                querySnapshot.forEach((document) => {
                    const p = document.data();
                    adminProductsList.innerHTML += `
                        <div class="bg-[#0A0A0A] p-3 rounded-xl flex justify-between items-center border gold-border">
                            <div class="flex items-center space-x-3 space-x-reverse">
                                <div class="w-10 h-10 bg-gray-800 rounded-lg overflow-hidden flex items-center justify-center">
                                    ${p.image ? `<img src="${p.image}" class="w-full h-full object-cover">` : `<i class="fa-solid fa-microchip text-xs gold-text"></i>`}
                                </div>
                                <div>
                                    <h4 class="font-bold text-xs text-white line-clamp-1">${p.name}</h4>
                                    <span class="text-[10px] gold-text font-bold">${p.finalPrice} د.أ (${p.cat})</span>
                                </div>
                            </div>
                            <button onclick="deleteProduct('${document.id}')" class="bg-red-600 hover:bg-red-700 px-3 py-1.5 rounded-lg text-xs font-bold transition text-white">حذف</button>
                        </div>
                    `;
                });
            } catch(e) {}
        }

        logoutBtn.addEventListener('click', () => {
            signOut(auth);
        });
    </script>
</body>
</html>
