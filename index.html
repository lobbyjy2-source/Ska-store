<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مؤسسة صخر المصري | قطع غيار وصيانة الهواتف</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #FFFFFF;
            --panel: #FFFFFF;
            --panel-2: #F9FAFB;
            --line: #E5E7EB;
            --text: #111827;
            --muted: #6B7280;
            --copper: #C2410C;
            --warn: #8F0909;
        }
        body.dark {
            --bg: #141414;
            --panel: #1C1C1C;
            --panel-2: #242424;
            --line: #333333;
            --text: #F5F5F5;
            --muted: #999999;
            --copper: #EA580C;
            --warn: #FF5555;
        }
        body { transition: background .2s, color .2s; }
        * { box-sizing:border-box; margin:0; padding:0; }
        html { scroll-behavior:smooth; }
        body { background:var(--bg); color:var(--text); font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="dark">
    <header class="sticky top-0 z-50 bg-[var(--panel)] border-b border-[var(--line)] shadow-sm">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3 space-x-reverse">
                <button onclick="toggleCart()" class="relative bg-[var(--copper)] text-white px-4 py-2 rounded-xl font-bold flex items-center space-x-2 space-x-reverse text-sm shadow hover:opacity-90">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span>السلة</span>
                    <span id="cart-count" class="bg-white text-[var(--copper)] text-xs px-2 py-0.5 rounded-full">0</span>
                </button>
                <a href="admin.html" class="bg-[var(--panel-2)] border border-[var(--line)] p-2.5 rounded-xl text-[var(--text)] hover:bg-[var(--line)]" title="لوحة التحكم">
                    <i class="fa-solid fa-gear text-lg"></i>
                </a>
            </div>
            <div class="text-right flex items-center space-x-3 space-x-reverse">
                <div>
                    <h1 id="store-title" class="font-black text-lg md:text-xl text-[var(--copper)]">مؤسسة صخر المصري</h1>
                    <p class="text-[10px] text-[var(--muted)] uppercase tracking-wider">PHONE PARTS & REPAIR</p>
                </div>
                <img id="store-logo" src="" alt="" class="w-10 h-10 rounded-full object-cover hidden">
            </div>
        </div>
    </header>

    <section class="container mx-auto px-4 py-8 text-center border-b border-[var(--line)]">
        <span class="bg-[var(--panel-2)] border border-[var(--line)] text-xs px-3 py-1 rounded-full text-[var(--muted)]">ORDER-2026-0417</span>
        <h2 class="text-2xl md:text-4xl font-black mt-3 mb-2">قطع غيار أصلية و <span class="text-[var(--copper)]">أدوات صيانة احترافية</span></h2>
        <p class="text-sm text-[var(--muted)] max-w-xl mx-auto mb-6">شاشات، بطاريات، أدوات فك وتركيب، وإكسسوارات لكل أنواع الهواتف - بجودة موثوقة وأسعار واضحة، من غير تعقيد.</p>
        <div class="flex justify-center gap-3">
            <a href="#products-section" class="bg-[var(--copper)] text-white px-6 py-2.5 rounded-xl font-bold text-sm shadow">تصفح المنتجات</a>
        </div>
    </section>

    <main id="products-section" class="container mx-auto px-4 py-8">
        <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
            <p class="text-center col-span-full text-[var(--muted)]">جاري تحميل المنتجات...</p>
        </div>
    </main>

    <div id="cart-drawer" class="fixed inset-0 bg-black/50 z-50 hidden flex justify-end">
        <div class="bg-[var(--panel)] w-full max-w-md h-full p-6 flex flex-col justify-between border-l border-[var(--line)]">
            <div>
                <div class="flex justify-between items-center mb-6">
                    <h3 class="font-bold text-lg">سلة الطلبات</h3>
                    <button onclick="toggleCart()" class="text-xl font-bold">&times;</button>
                </div>
                <div id="cart-items" class="space-y-3 max-h-[60vh] overflow-y-auto">
                    <p class="text-center text-[var(--muted)]">السلة فارغة حالياً</p>
                </div>
            </div>
            <div class="border-t border-[var(--line)] pt-4">
                <div class="flex justify-between font-bold text-lg mb-4">
                    <span>الإجمالي</span>
                    <span id="cart-total">0 د.أ</span>
                </div>
                <button onclick="alert('تم إرسال الطلب بنجاح!')" class="w-full bg-[var(--copper)] text-white py-3 rounded-xl font-bold shadow">إتمام الطلب</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCb09c67UUqwwLr-vULeTkHqQR2li7AASI",
            authDomain: "ska-storu.firebaseapp.com",
            projectId: "ska-storu",
            storageBucket: "ska-storu.firebasestorage.app",
            messagingSenderId: "574053376429",
            appId: "1:574053376429:web:b3d01c62c625b10a368124"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let cart = [];
        let productsList = [];

        async function loadSettings() {
            try {
                const sDoc = await getDoc(doc(db, "settings", "general"));
                if (sDoc.exists()) {
                    const data = sDoc.data();
                    if(data.storeName) document.getElementById('store-title').innerText = data.storeName;
                    if(data.storeLogo) {
                        const logoEl = document.getElementById('store-logo');
                        logoEl.src = data.storeLogo;
                        logoEl.classList.remove('hidden');
                    }
                    if(data.storeTheme) {
                        document.body.className = data.storeTheme.includes('900') ? 'dark' : '';
                    }
                }
            } catch(e) {}
        }

        async function loadProducts() {
            const grid = document.getElementById('products-grid');
            grid.innerHTML = '';
            try {
                const querySnapshot = await getDocs(collection(db, "products"));
                if (querySnapshot.empty) {
                    grid.innerHTML = '<p class="text-center col-span-full text-[var(--muted)]">لا توجد منتجات متاحة حالياً.</p>';
                    return;
                }
                productsList = [];
                querySnapshot.forEach((document) => {
                    const p = document.data();
                    p.id = document.id;
                    productsList.push(p);
                    
                    grid.innerHTML += `
                        <div class="bg-[var(--panel)] border border-[var(--line)] rounded-2xl p-4 flex flex-col justify-between shadow-sm">
                            <div>
                                <div class="flex justify-between items-start mb-3">
                                    <span class="text-xs bg-[var(--panel-2)] border border-[var(--line)] px-2 py-1 rounded-lg text-[var(--muted)]">قطعة أصلية</span>
                                    <i class="fa-solid fa-mobile-screen text-2xl text-[var(--muted)]"></i>
                                </div>
                                <h3 class="font-bold text-sm mb-1">${p.name}</h3>
                                <p class="text-xs text-[var(--muted)] mb-3">${p.description || ''}</p>
                            </div>
                            <div class="flex justify-between items-center mt-4 pt-3 border-t border-[var(--line)]">
                                <div>
                                    <span class="font-black text-[var(--copper)]">${p.finalPrice || p.price} د.أ</span>
                                    ${p.discount ? `<span class="text-xs line-through text-gray-500 mr-2">${p.price}</span>` : ''}
                                </div>
                                <button onclick="addToCart('${p.id}')" class="bg-[var(--copper)] text-white w-8 h-8 rounded-xl font-bold flex items-center justify-center hover:opacity-90">+</button>
                            </div>
                        </div>
                    `;
                });
            } catch (err) {
                grid.innerHTML = '<p class="text-center col-span-full text-red-500">خطأ في تحميل المنتجات</p>';
            }
        }

        window.addToCart = function(id) {
            const product = productsList.find(p => p.id === id);
            cart.push(product);
            updateCart();
        }

        function updateCart() {
            document.getElementById('cart-count').innerText = cart.length;
            const container = document.getElementById('cart-items');
            container.innerHTML = '';
            
            if(cart.length === 0) {
                container.innerHTML = '<p class="text-center text-[var(--muted)]">السلة فارغة حالياً</p>';
                document.getElementById('cart-total').innerText = '0 د.أ';
                return;
            }

            let total = 0;
            cart.forEach((item, index) => {
                const price = Number(item.finalPrice || item.price);
                total += price;
                container.innerHTML += `
                    <div class="flex justify-between items-center bg-[var(--panel-2)] p-3 rounded-xl border border-[var(--line)]">
                        <div>
                            <h4 class="font-bold text-sm">${item.name}</h4>
                            <span class="text-xs text-[var(--copper)]">${price} د.أ</span>
                        </div>
                        <button onclick="removeFromCart(${index})" class="text-[var(--warn)] text-xs font-bold">حذف</button>
                    </div>
                `;
            });
            document.getElementById('cart-total').innerText = total + ' د.أ';
        }

        window.removeFromCart = function(index) {
            cart.splice(index, 1);
            updateCart();
        }

        window.toggleCart = function() {
            document.getElementById('cart-drawer').classList.toggle('hidden');
        }

        loadSettings();
        loadProducts();
    </script>
</body>
</html>
