<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKA Store - المتجر</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen">
    
    <!-- شريط التنقل -->
    <nav class="bg-gray-800 border-b border-gray-700 p-4 flex justify-between items-center">
        <h1 class="text-xl font-bold text-orange-500">SKA Store 🚀</h1>
        <a href="admin.html" class="bg-orange-600 hover:bg-orange-700 px-4 py-2 rounded text-sm font-bold">لوحة التحكم ⚙️</a>
    </nav>

    <!-- محتوى المتجر -->
    <main class="container mx-auto p-4">
        <h2 class="text-2xl font-bold mb-6 text-center">المنتجات المتوفرة</h2>
        <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
            <!-- سيتم تحميل المنتجات تلقائياً من قاعدة البيانات -->
            <p class="text-center col-span-full text-gray-400">جاري تحميل المنتجات...</p>
        </div>
    </main>

    <!-- سكربت الفايربيس وعرض المنتجات -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCb09c67UUqwwLr-vULeTkHqQR2li7AASI",
            authDomain: "ska-storu.firebaseapp.com",
            projectId: "ska-storu",
            storageBucket: "ska-storu.firebasestorage.app",
            messagingSenderId: "574053376429",
            appId: "1:574053376429:web:b3d01c62c625b10a368124"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function loadProducts() {
            const grid = document.getElementById('products-grid');
            grid.innerHTML = '';
            try {
                const querySnapshot = await getDocs(collection(db, "products"));
                if (querySnapshot.empty) {
                    grid.innerHTML = '<p class="text-center col-span-full text-gray-400">لا توجد منتجات حالياً. أضف منتجات من لوحة التحكم!</p>';
                    return;
                }
                querySnapshot.forEach((doc) => {
                    const p = doc.data();
                    grid.innerHTML += `
                        <div class="bg-gray-800 border border-gray-700 rounded-lg p-4 flex flex-col justify-between shadow-md">
                            <div>
                                <h3 class="text-lg font-bold text-orange-400 mb-2">${p.name}</h3>
                                <p class="text-gray-300 text-sm mb-4">${p.description}</p>
                            </div>
                            <div class="flex justify-between items-center mt-4 pt-3 border-t border-gray-700">
                                <div>
                                    ${p.discount ? `<span class="line-through text-gray-500 text-sm ml-2">${p.price} $</span>` : ''}
                                    <span class="text-green-400 font-bold text-lg">${p.finalPrice || p.price} $</span>
                                </div>
                                <button onclick="alert('تمت إضافة المنتج للسلة')" class="bg-orange-600 hover:bg-orange-700 px-3 py-1 rounded text-sm font-bold">شراء</button>
                            </div>
                        </div>
                    `;
                });
            } catch (error) {
                grid.innerHTML = '<p class="text-center col-span-full text-red-400">خطأ في تحميل المنتجات.</p>';
            }
        }

        loadProducts();
    </script>
</body>
</html>
